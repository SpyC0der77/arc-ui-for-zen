// Zennia: local, profile-scoped startup loader.
// Keep this file minimal: in-place theme updates cannot replace it. The version
// check and everything else live in the profile's zennia-start.js, which theme
// updates can change, including on Zen versions Zennia does not support yet.
(() => {
  if (Services.appinfo.inSafeMode) return;
  const folder = Services.dirsvc.get("ProfD", Ci.nsIFile);
  folder.append("chrome"); folder.append("zennia");
  if (!folder.exists()) return;
  try {
    const manifest = folder.clone(); manifest.append("chrome.manifest");
    Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);
  } catch (error) { Cu.reportError(error); return; }
  const observer = {
    observe(win) {
      if (win.document.documentElement.getAttribute("windowtype") !== "navigator:browser") return;
      try {
        Services.scriptloader.loadSubScript("chrome://zennia-runtime/content/zennia-start.js", win, "UTF-8");
      } catch (error) { Cu.reportError(error); }
    },
  };
  Services.obs.addObserver(observer, "browser-delayed-startup-finished");
})();
