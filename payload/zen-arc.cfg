// Arc Skeleton for Zen: local, profile-scoped startup loader.
(() => {
  if (Services.appinfo.inSafeMode) return;
  const folder = Services.dirsvc.get("ProfD", Ci.nsIFile);
  folder.append("chrome"); folder.append("zen-arc");
  if (!folder.exists()) return;
  // Refuse to run against untested browser releases. The installer reports the mismatch too.
  if (Services.appinfo.version !== "1.23.4b") return;
  try {
    const manifest = folder.clone(); manifest.append("chrome.manifest");
    Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);
  } catch (error) { Cu.reportError(error); }
  const observer = {
    observe(win) {
      if (win.document.documentElement.getAttribute("windowtype") !== "navigator:browser") return;
      const script = folder.clone(); script.append("arc.uc.js");
      try {
        Services.scriptloader.loadSubScript("chrome://arc-skeleton-runtime/content/arc.uc.js", win, "UTF-8");
      } catch (error) { Cu.reportError(error); }
    },
  };
  Services.obs.addObserver(observer, "browser-delayed-startup-finished");
})();
