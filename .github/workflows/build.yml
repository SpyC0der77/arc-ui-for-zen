name: Build Arc UI for Zen installer
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm verify:package
      - name: Smoke-test packaged Windows installer
        if: matrix.target == 'win'
        run: pnpm exec electron tests/installer-smoke.cjs "${{ github.workspace }}/release/win-unpacked/resources/app.asar"
      - uses: actions/upload-artifact@v4
        with:
          name: arc-ui-zen-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
