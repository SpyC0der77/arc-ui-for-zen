name: Build Zennia installer
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Compress the installers fully for publishing.
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    # The installer is a workspace package; artifacts/ and zen-instances/ stay
    # at the repository root.
    working-directory: apps/installer
concurrency:
  group: installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: versions
        run: echo "matrix=$(node scripts/fetch-zen-runtime.cjs --matrix)" >> "$GITHUB_OUTPUT"
  runtime:
    needs: runtime-matrix
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runtime-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      # The runtime scripts use only Node built-ins and repository files, so
      # this job skips pnpm and the dependency install.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      # The driver includes compiled modules, so the key names the exact Python.
      - name: Restore native pointer test driver
        id: pointer-driver
        uses: actions/cache@v4
        with:
          path: artifacts/test-python
          key: pointer-driver-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('apps/installer/tests/runtime-requirements.txt') }}
      - name: Install native pointer test driver
        if: steps.pointer-driver.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check --target ../../artifacts/test-python -r tests/runtime-requirements.txt
      - name: Fetch pinned Zen runtime
        run: node scripts/fetch-zen-runtime.cjs ${{ matrix.version }}
      - name: Check Zen internals against zen-versions data
        run: node scripts/zen-surface.cjs ${{ matrix.version }}
      - name: Verify isolated Zen runtime
        run: node tests/runtime.cjs "../../artifacts/zen-builds/${{ matrix.version }}/core" --pointer
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zen-runtime-${{ matrix.version }}-diagnostics
          if-no-files-found: ignore
          # Only explicit diagnostic outputs, never application copies or profiles.
          path: |
            zen-instances/runtime-*/diagnostics/*.json
            zen-instances/runtime-*/diagnostics/*.log
            zen-instances/runtime-*/diagnostics/*.png
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # electron-builder always packs the Windows portable app at 7-Zip's
      # maximum level, which took about 2.5 minutes. Pull request and branch
      # builds only need a working installer; releases keep full compression.
      - name: Use fast installer compression outside releases
        if: ${{ !inputs.release }}
        shell: bash
        run: echo "ELECTRON_BUILDER_COMPRESSION_LEVEL=1" >> "$GITHUB_ENV"
      - run: pnpm dist:${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # mac.identity is "-": ad-hoc signing needs no certificate or secrets.
          CSC_FOR_PULL_REQUEST: 'true'
      - run: pnpm verify:package
      - name: Smoke-test packaged Windows installer
        if: matrix.target == 'win'
        run: pnpm exec electron tests/installer-smoke.cjs "${{ github.workspace }}/apps/installer/release/win-unpacked/resources/app.asar"
      - uses: actions/upload-artifact@v4
        with:
          name: zennia-${{ matrix.target }}
          if-no-files-found: error
          # The installers are already compressed archives.
          compression-level: 0
          path: |
            apps/installer/release/*.exe
            apps/installer/release/*.dmg
            apps/installer/release/*.zip
            apps/installer/release/*.AppImage
