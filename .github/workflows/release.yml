name: Create release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release tag and version
        run: node scripts/release.cjs validate

  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    # This reusable workflow must succeed in every installer and Zen runtime
    # matrix job before the publishing job below can run.

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: arc-ui-zen-*
          path: release
          merge-multiple: true
      - name: Prepare compatibility notes and checksums
        run: node scripts/release.cjs prepare
      - name: Publish release with all installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          args=(--verify-tag --title "Arc UI for Zen ${RELEASE_TAG}" --notes-file release-notes.md --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" release/* "${args[@]}"
